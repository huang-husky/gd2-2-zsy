<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>致赵老师的一封信</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'LetterFont';
      src: url('text.subset.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --ink: #2d3748;     
      --ink-soft: #4a5568;
      --ink-faint: #718096;
      --line: #cbd5e0;
      --accent: #3182ce;        
      --accent-soft: rgba(49, 130, 206, 0.10);
      --paper: #faf9f7;  
      --grid: rgba(49, 130, 206, 0.06);
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'LetterFont', 'Noto Serif SC', 'KaiTi', 'STKaiti', serif;
      color: var(--ink);
      line-height: 2.0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f7f6f4 0%, #ebe8e3 100%);
      overflow-x: hidden;
    }

    .page-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 85% 75% at 50% 45%, #000 25%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 45%, #000 25%, transparent 80%);
    }

    .gate {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      text-align: center;
      animation: fadeIn 1.2s ease-out;
      transition: opacity 0.7s ease;
    }
    .gate.leaving { opacity: 0; }

    .coord-grid {
      position: relative;
      width: 280px;
      height: 200px;
      margin-bottom: 40px;
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 28px 25px;
      border-left: 1px solid var(--ink-faint);
      border-bottom: 1px solid var(--ink-faint);
    }

    .scatter-point {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-faint);
      transform: translate(-50%, 50%);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.6;
    }
    .scatter-point.on {
      background: var(--accent);
      opacity: 1;
      transform: translate(-50%, 50%) scale(1.3);
      box-shadow: 0 0 8px var(--accent-soft);
    }

    .utility-curve {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .utility-curve.show {
      opacity: 0.4;
    }
    .utility-curve svg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    .axis-label {
      position: absolute;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--ink-faint);
    }
    .axis-label.x { right: 4px; bottom: -20px; }
    .axis-label.y { left: -20px; top: 4px; }

    .gate h2 {
      font-family: 'Segoe UI Symbol', 'Yu Gothic', 'KaiTi', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--ink-soft);
      margin-bottom: 12px;
    }
    .gate .sub {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
      margin-bottom: 36px;
    }
    .gate input {
      font-family: inherit;
      font-size: 1.05rem;
      width: 260px; max-width: 78vw;
      padding: 10px 4px;
      text-align: center;
      letter-spacing: 0.2em;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      outline: none;
      transition: border-color 0.3s;
    }
    .gate input::placeholder {
      font-family: var(--mono);
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      font-size: 0.85rem;
    }
    .gate input:focus { border-bottom-color: var(--accent); }
    .gate button {
      margin-top: 28px;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 2px;
      padding: 8px 32px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .gate button:hover { background: var(--accent); color: #fff; }
    .gate button:disabled { opacity: 0.45; cursor: wait; }
    .gate .hint {
      margin-top: 18px;
      min-height: 1.6em;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: #c53030;
    }
    .gate .hint.ok { color: var(--accent); }

    .coord-grid.denied {
      animation: denyShake 0.5s ease;
    }
    @keyframes denyShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .container {
      display: none;
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 56px auto 80px;
      padding: 68px 72px 60px;
      background: var(--paper);
      border: 1px solid #e2e2dc;
      border-radius: 3px;
      box-shadow:
        0 4px 6px rgba(45, 55, 72, 0.03),
        0 10px 40px rgba(45, 55, 72, 0.08);
      animation: fadeIn 1.1s ease-out;
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to right,
        transparent 0%,
        var(--accent) 15%,
        var(--accent) 85%,
        transparent 100%);
      opacity: 0.6;
    }
    .meta {
      position: absolute;
      top: 22px; right: 26px;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
    }

    #letterBox { position: relative; }

    .header { text-align: center; margin-bottom: 44px; }
    .header h1 {
      font-family: 'Noto Serif SC', 'KaiTi', serif;
      font-size: 1.95rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: var(--ink);
    }
    .rule {
      width: 80px; height: 1px;
      margin: 18px auto 0;
      background: var(--line);
      position: relative;
    }
    .rule::after {
      content: '';
      position: absolute;
      right: -12px; top: -3px;
      width: 0; height: 0;
      border-left: 6px solid var(--accent);
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
    }

    .salutation {
      font-size: 1.1rem;
      margin-bottom: 1.4em;
      color: var(--ink-soft);
    }
    .paragraph {
      position: relative;
      font-size: 1.06rem;
      text-indent: 2em;
      text-align: justify;
      margin-bottom: 1.4em;
      color: var(--ink);
    }

    .quote {
      margin: 2em 0 2em 1.8em;
      padding: 0.2em 0 0.2em 1.4em;
      border-left: 2px solid var(--accent);
      text-indent: 0;
      font-size: 1.05rem;
      line-height: 1.9;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
      position: relative;
    }
    .quote::before {
      content: '✑';
      position: absolute;
      left: -0.6em;
      top: -0.3em;
      font-size: 1.2rem;
      color: var(--accent);
      transform: rotate(-15deg);
    }
    .highlight {
      position: relative;
      color: var(--accent);
      font-weight: 500;
    }
    .highlight::after {
      content: '';
      position: absolute;
      left: -0.15em; right: -0.15em;
      top: 0.1em; bottom: 0.1em;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
    }

    .paragraph[data-addr]::before {
      content: attr(data-addr);
      position: absolute;
      left: -48px;
      top: 0.5em;
      text-indent: 0;
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.04em;
      color: rgba(49, 130, 206, 0.35);
      pointer-events: none;
    }

    .progress {
      display: none;
      position: fixed;
      top: 0; left: 0;
      height: 2px; width: 0;
      background: linear-gradient(to right, rgba(49, 130, 206, 0.35), var(--accent));
      z-index: 20;
    }

    ::selection {
      background: rgba(49, 130, 206, 0.15);
      color: var(--ink);
    }
    .boundary {
      position: relative;
      height: 1px;
      margin: 48px 0 40px;
      border-top: 1px dashed var(--ink-faint);
    }
    .boundary::after {
      content: '';
      position: absolute;
      left: 50%; top: -4px;
      width: 8px; height: 8px;
      margin-left: -4px;
      background: var(--paper);
      border: 1.5px solid var(--accent);
      border-radius: 50%;
    }
    .boundary::before {
      content: 'O';
      position: absolute;
      left: 50%; top: -22px;
      margin-left: -6px;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--ink-faint);
    }

    .beyond {
      margin-left: -22px;
      margin-right: -22px;
    }
    .key-line {
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .closing {
      text-indent: 0;
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: var(--ink);
      margin-top: 2em;
      margin-bottom: 0;
    }

    .signature {
      margin-top: 48px;
      text-align: right;
      color: var(--ink-soft);
      line-height: 2;
      font-size: 1rem;
    }
    .signature .name {
      font-size: 1.15rem;
      color: var(--ink);
      letter-spacing: 0.12em;
    }
    .signature .date {
      font-family: var(--mono);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      color: var(--ink-faint);
    }

    .salutation, .paragraph, .quote, .signature, .boundary {
      opacity: 0;
      animation: riseIn 0.8s ease forwards;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .music-btn {
      display: none;
      position: fixed;
      bottom: 24px; right: 24px;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(250, 249, 247, 0.95);
      color: var(--accent);
      font-size: 1.1rem;
      cursor: pointer;
      align-items: center; justify-content: center;
      z-index: 10;
      transition: all 0.3s ease;
      backdrop-filter: blur(3px);
    }
    .music-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transform: scale(1.05);
    }
    .music-btn.playing .icon {
      animation: pulse 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.9); opacity: 0.7; }
    }

    @media (max-width: 920px) {
      .paragraph[data-addr]::before { display: none; }
    }

    @media (max-width: 768px) {
      .container { margin: 20px 12px 56px; padding: 48px 24px 42px; }
      .header h1 { font-size: 1.55rem; }
      .paragraph { font-size: 1rem; line-height: 1.9; }
      .quote { margin-left: 0.8em; padding-left: 1em; font-size: 1rem; }
      .beyond { margin-left: -8px; margin-right: -8px; }
      .meta { top: 16px; right: 16px; }
      .gate h2 { font-size: 1.25rem; }
      .coord-grid { width: 240px; height: 170px; }
    }
  </style>
</head>
<body>

<div class="page-grid"></div>
<div class="progress" id="progress"></div>

<div class="gate" id="gate">
  <div class="coord-grid" id="coordGrid">
    <span class="axis-label y">U</span>
    <span class="axis-label x">X</span>
    <svg class="utility-curve" id="utilityCurve" viewBox="0 0 280 200" preserveAspectRatio="none">
      <path d="M 20 180 Q 60 160, 100 140 T 180 80 T 260 20"
            fill="none"
            stroke="#3182ce"
            stroke-width="2"
            stroke-linecap="round"/>
    </svg>
  </div>
  <h2>✑ 待启封</h2>
  <p class="sub">awaiting access key</p>
  <input type="password" id="pwInput" placeholder="请输入访问密码" autocomplete="off">
  <button id="unlockBtn">验 证</button>
  <p class="hint" id="hint"></p>
</div>

<div class="container" id="letterWrap">
  <div class="meta">2026.08</div>
  <div id="letterBox"></div>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="bg.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" class="music-btn" title="播放 / 暂停音乐">
  <span class="icon">♪</span>
</button>

  const b64ToBuf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function decrypt(password) {
    const [saltB64, ivB64, ctB64] = ENCRYPTED.split('.');
    const salt = b64ToBuf(saltB64);
    const iv = b64ToBuf(ivB64);
    const ct = b64ToBuf(ctB64);

    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false, ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(plainBuf);
  }

  const coordGrid = document.getElementById('coordGrid');
  const scatterPoints = [];

  const pointPositions = [
    [0.08, 0.9], [0.15, 0.82], [0.22, 0.75], [0.30, 0.68],
    [0.38, 0.60], [0.45, 0.52], [0.52, 0.45], [0.58, 0.38],
    [0.65, 0.32], [0.71, 0.26], [0.77, 0.20], [0.82, 0.15],
    [0.87, 0.11], [0.91, 0.08], [0.95, 0.05], [0.98, 0.02]
  ];

  pointPositions.forEach(([x, y]) => {
    const pt = document.createElement('div');
    pt.className = 'scatter-point';
    pt.style.left = (x * 100) + '%';
    pt.style.bottom = ((1 - y) * 100) + '%';
    coordGrid.appendChild(pt);
    scatterPoints.push(pt);
  });

  const gate = document.getElementById('gate');
  const pwInput = document.getElementById('pwInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const hint = document.getElementById('hint');
  const letterWrap = document.getElementById('letterWrap');
  const letterBox = document.getElementById('letterBox');
  const audio = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  const progress = document.getElementById('progress');
  const utilityCurve = document.getElementById('utilityCurve');
  let isPlaying = false;

  audio.load();

  function updateProgress() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? Math.min(1, window.scrollY / max) : 0;
    progress.style.width = (pct * 100).toFixed(2) + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);

  function setMusicState(playing) {
    isPlaying = playing;
    musicBtn.classList.toggle('playing', playing);
    musicBtn.title = playing ? '暂停音乐' : '播放音乐';
  }

  async function tryUnlock() {
    const pw = pwInput.value.trim();
    if (!pw) { hint.textContent = '请输入密码'; hint.classList.remove('ok'); return; }
    unlockBtn.disabled = true;
    hint.textContent = '';
    hint.classList.remove('ok');
    try {
      const html = await decrypt(pw);

      audio.volume = 0.6;
      audio.play().then(() => setMusicState(true)).catch(() => setMusicState(false));

      hint.textContent = 'key accepted';
      hint.classList.add('ok');

      scatterPoints.forEach((pt, i) => {
        setTimeout(() => pt.classList.add('on'), i * 50);
      });

      setTimeout(() => utilityCurve.classList.add('show'), 800);

      setTimeout(() => gate.classList.add('leaving'), 16 * 50 + 1000);
      setTimeout(() => {
        gate.style.display = 'none';
        letterBox.innerHTML = html;
        letterWrap.style.display = 'block';
        musicBtn.style.display = 'flex';
        document.title = letterBox.querySelector('h1')?.textContent || document.title;
        realTitle = document.title;

        const boundary = letterBox.querySelector('.boundary');
        let addr = 1;
        letterBox.querySelectorAll('.paragraph').forEach(p => {
          const beforeBoundary = boundary &&
            (p.compareDocumentPosition(boundary) & Node.DOCUMENT_POSITION_FOLLOWING);
          if (beforeBoundary) {
            p.dataset.addr = `(${addr}, 0)`;
            addr++;
          }
        });

        letterBox.querySelectorAll('.salutation, .paragraph, .quote, .boundary, .signature')
          .forEach((el, i) => {
            el.style.animationDelay = (0.2 + i * 0.18) + 's';
          });

        progress.style.display = 'block';
        updateProgress();
      }, 16 * 50 + 1600);
    } catch (e) {
      hint.textContent = 'key rejected';
      hint.classList.remove('ok');
      coordGrid.classList.remove('denied');
      void coordGrid.offsetWidth;
      coordGrid.classList.add('denied');
      pwInput.select();
      unlockBtn.disabled = false;
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  musicBtn.addEventListener('click', () => {
    if (isPlaying) {
      audio.pause();
      setMusicState(false);
    } else {
      audio.play().then(() => setMusicState(true)).catch(() => {
        musicBtn.title = '播放失败：请确认音乐已放入本文件夹';
      });
    }
  });

  let realTitle = document.title;
  let titleTimer = null;
  document.addEventListener('visibilitychange', () => {
    clearTimeout(titleTimer);
    if (document.hidden) {
      document.title = '（；´д｀）ゞ 别走呀…';
    } else {
      document.title = 'ヾ(^▽^*))) 欢迎回来！';
      titleTimer = setTimeout(() => { document.title = realTitle; }, 2000);
    }
  });

  audio.addEventListener('ended', () => {
    audio.load();
    audio.play().then(() => setMusicState(true)).catch(() => setMusicState(false));
  });
</script>
